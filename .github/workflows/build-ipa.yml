name: Build unsigned IPA

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload the IPA to"
        required: true
        default: "v1.2"

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build (unsigned)
        run: ./build.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 聊天记录迁移-ipa
          path: 聊天记录迁移.ipa

      # Also publish the IPA to a dedicated `builds` branch so it can
      # be fetched without the Actions UI: the raw IPA plus base64
      # parts (60 KB each) and a sha256 manifest for verification.
      - name: Publish IPA to builds branch
        run: |
          cp 聊天记录迁移.ipa /tmp/聊天记录迁移.ipa
          shasum -a 256 /tmp/聊天记录迁移.ipa | awk '{print $1}' > /tmp/ipa.sha256
          base64 -i /tmp/聊天记录迁移.ipa > /tmp/ipa.b64
          split -b 60000 /tmp/ipa.b64 /tmp/ipa_part_
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B builds
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/聊天记录迁移.ipa .
          cp /tmp/ipa.sha256 .
          cp /tmp/ipa_part_* .
          ls ipa_part_* | wc -l | tr -d ' ' > ipa_parts.count
          git add 聊天记录迁移.ipa ipa.sha256 ipa_parts.count ipa_part_*
          git commit -m "Build 聊天记录迁移.ipa"
          git push origin builds --force

  release-upload:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Build (unsigned)
        run: ./build.sh

      # Upload with an ASCII asset name (WQMove-<version>.ipa):
      # GitHub rewrites non-ASCII asset filenames server-side
      # (聊天记录迁移.ipa became default.ipa). Delete any existing
      # assets first so the release ends up with exactly this IPA.
      - name: Upload IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          ASSET_NAME="WQMove-${VERSION}.ipa"
          cp "聊天记录迁移.ipa" "$ASSET_NAME"
          RELEASE_ID=$(gh api "repos/xqwzka/wq-move/releases/tags/$TAG" --jq .id)
          for ASSET_ID in $(gh api "repos/xqwzka/wq-move/releases/$RELEASE_ID/assets" --jq '.[].id'); do
            gh api -X DELETE "repos/xqwzka/wq-move/releases/assets/$ASSET_ID"
          done
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$ASSET_NAME" \
            "https://uploads.github.com/repos/xqwzka/wq-move/releases/$RELEASE_ID/assets?name=$ASSET_NAME"
